[versions]
managed-jakarta-jms-api = '3.1.0'
managed-activemq-jakarta = '6.2.4'
managed-artemis-jakarta-client = '2.53.0'
micronaut = "5.0.0-M22"
micronaut-platform = "4.10.8"
micronaut-test = "5.0.0-M6"
micronaut-logging = "2.0.0-M2"
micronaut-validation = "5.0.0-M1"
micronaut-aws = "5.0.0-M1"
micronaut-gradle-plugin = "4.6.2"
amazon-sqs-messaging = '2.1.4'
awaitility = '4.3.0'
commons-pool2 = '2.13.1'
graal-svm = "25.0.2"
json-api = '1.1.4'
jcl-slf4j = '2.0.17'
jsr305 = "3.0.2"
spotbugs = "4.9.8"

[libraries]
managed-artemis-jakarta-client = { module = 'org.apache.activemq:artemis-jakarta-client', version.ref = 'managed-artemis-jakarta-client' }
managed-jakarta-jms-api = { module = 'jakarta.jms:jakarta.jms-api', version.ref = 'managed-jakarta-jms-api'}
managed-activemq-client-jakarta = { module = 'org.apache.activemq:activemq-client', version.ref = 'managed-activemq-jakarta' }

micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform-bom", version.ref = "micronaut-platform" }
micronaut-aws = { module = "io.micronaut.aws:micronaut-aws-bom", version.ref = "micronaut-aws" }

activemq-broker = { module = 'org.apache.activemq:activemq-broker', version.ref = 'managed-activemq-jakarta' }
amazon-sqs-messaging = { module = 'com.amazonaws:amazon-sqs-java-messaging-lib', version.ref = 'amazon-sqs-messaging' }
awaitility = { module = 'org.awaitility:awaitility', version.ref = 'awaitility' }
aws-sqs = { module = 'software.amazon.awssdk:sqs' }
commons-pool2 = { module = 'org.apache.commons:commons-pool2', version.ref = 'commons-pool2' }
graal-svm = { module = "org.graalvm.nativeimage:svm", version.ref = "graal-svm" }
jcl-slf4j = { module = 'org.slf4j:jcl-over-slf4j', version.ref = 'jcl-slf4j' }
jsr305 = {group = "com.google.code.findbugs", name = "jsr305", version.ref = "jsr305" }
spotbugs = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs" }
javax-json-api = { module = 'javax.json:javax.json-api', version.ref = 'json-api' }

testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-localstack = { module = "org.testcontainers:testcontainers-localstack" }
testcontainers-activemq = { module = "org.testcontainers:testcontainers-activemq" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter"}
#plugins
micronaut-gradle-plugin = { module = 'io.micronaut.gradle:micronaut-gradle-plugin', version.ref = 'micronaut-gradle-plugin' }
